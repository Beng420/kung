plugins {
  id "net.fabricmc.fabric-loom"
}

base {
  archivesName = "${mod_id}-${minecraft_version_26_2}"
}

java {
  sourceCompatibility = JavaVersion.VERSION_25
  targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
  options.release = java_release_26_2.toInteger()
}

dependencies {
  minecraft "com.mojang:minecraft:${minecraft_version_26_2}"
  implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
  implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_26_2}"
}

processResources {
  inputs.property "version", project.version
  inputs.property "minecraft_version", minecraft_version_26_2
  inputs.property "loader_version", fabric_loader_version

  filesMatching("fabric.mod.json") {
    expand(
      version: project.version,
      minecraft_version: minecraft_version_26_2,
      loader_version: fabric_loader_version,
      mod_id: mod_id,
      mod_name: mod_name,
      mod_description: mod_description,
      mod_author: mod_author,
      mod_license: mod_license
    )
  }
}
